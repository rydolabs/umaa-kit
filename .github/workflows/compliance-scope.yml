name: UMAA 6.0 conformance scope integrity (not certification)
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'docs/specification/UMAA_6_0_CONFORMANCE_SCOPE.md'
      - 'tools/verify_compliance_scope.py'
      - 'tools/verify_official_component_roles.py'
      - 'tools/test_compliance_scope.py'
      - 'sdk/tests/test_component_contract_provenance.py'
      - '.github/workflows/compliance-scope.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'docs/specification/UMAA_6_0_CONFORMANCE_SCOPE.md'
      - 'tools/verify_compliance_scope.py'
      - 'tools/verify_official_component_roles.py'
      - 'tools/test_compliance_scope.py'
      - 'sdk/tests/test_component_contract_provenance.py'
      - '.github/workflows/compliance-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-scope-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Negative tests and baseline checks
        run: python3 -m unittest discover -s tools -p 'test_compliance_scope.py' -v
      - name: Authenticate source-pinned AUVSI Component Definitions section 3 role legend and 91 rows
        env:
          COMPONENT_SHA256: 872fd164b9a07b963d0d02d4ae026b2c4e34621654677aa2dbceec2a6ead0e75
          COMPONENT_URL: https://www.auvsi.org/wp-content/uploads/2025/03/Distro_A_UMAA_Component_Definitions_v1.0.pdf
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 \
            --connect-timeout 20 --max-time 120 "$COMPONENT_URL" \
            --output "$RUNNER_TEMP/original-component-definitions.pdf"
          printf '%s  %s\n' "$COMPONENT_SHA256" "$RUNNER_TEMP/original-component-definitions.pdf" | sha256sum --check
          mkdir -p build/compliance
          python3 -m tools.verify_official_component_roles \
            --pdf "$RUNNER_TEMP/original-component-definitions.pdf" \
            > build/compliance/verified-roles.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("build/compliance/verified-roles.json").read_text())
          assert (d["components"],d["providerRows"],d["consumerRows"]) == (9,51,40)
          assert d["membershipApproved"] is False and d["qosProfileApproved"] is False
          assert d["officialRuntimeEnabled"] is False and d["formalConformance"] is False
          print("UMAA_SOURCE_VERIFIED_COMPONENT_ROLES_PASS")
          PY
      - name: Generate JSON preflight evidence
        run: python3 tools/verify_compliance_scope.py --report build/compliance/trace-preflight.json
      - name: Strict acceptance must reject missing normative coverage
        shell: bash
        run: |
          set +e
          python3 tools/verify_compliance_scope.py --strict > build/compliance/strict-result.json
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "::error::Expected strict conformance gate exit 3; got $code"
            exit 1
          fi
          echo 'UMAA_NORMATIVE_SCOPE_STRICT_BLOCKED_AS_EXPECTED exit=3'
      - name: Upload non-certification trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umaa6-conformance-preflight
          path: build/compliance/
          if-no-files-found: warn
