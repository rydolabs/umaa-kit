name: ICD YAML contract schema (design only)
on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/icd-yaml-contract.yml'
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/icd-yaml-contract.yml'
jobs:
  yaml-schema:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated schema validation dependencies
        run: python -m pip install -r contracts/requirements.txt
      - name: Validate source-annotated service YAML
        run: python -m contracts.validate contracts/services/SA/GlobalPoseStatus.service.yaml
      - name: Test extension, provenance and unsafe YAML rejection
        run: python -m unittest discover -s contracts/tests -p 'test_*.py' -v
