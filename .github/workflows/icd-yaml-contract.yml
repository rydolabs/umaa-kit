name: ICD YAML catalog projection
on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'catalog/umaa6-six-icd-reviewed.json'
      - 'schemas/umaa-icd-v1alpha1.schema.json'
      - 'tools/test_icd_yaml_catalog_projection.py'
      - '.github/workflows/icd-yaml-contract.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'catalog/umaa6-six-icd-reviewed.json'
      - 'schemas/umaa-icd-v1alpha1.schema.json'
      - 'tools/test_icd_yaml_catalog_projection.py'
      - '.github/workflows/icd-yaml-contract.yml'
jobs:
  projection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML and JSON Schema validation dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'jsonschema==4.23.0'
      - name: Check exact reviewed catalog coverage and strict schema
        run: python -m unittest discover -s tools -p 'test_icd_yaml_catalog_projection.py' -v
