name: ICD YAML catalog projection
on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'catalog/umaa6-six-icd-reviewed.json'
      - 'schemas/umaa-icd-v1alpha1.schema.json'
      - 'tools/generate_icd_yaml.py'
      - 'tools/validate_icd_yaml.py'
      - 'tools/umaa_service_contracts.py'
      - 'sdk/tests/test_icd_yaml_contract.py'
      - '.github/workflows/icd-yaml-contract.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'catalog/umaa6-six-icd-reviewed.json'
      - 'schemas/umaa-icd-v1alpha1.schema.json'
      - 'tools/generate_icd_yaml.py'
      - 'tools/validate_icd_yaml.py'
      - 'tools/umaa_service_contracts.py'
      - 'sdk/tests/test_icd_yaml_contract.py'
      - '.github/workflows/icd-yaml-contract.yml'
jobs:
  projection:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned YAML and JSON Schema dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'jsonschema==4.23.0'
      - name: Assert deterministic generated YAML
        run: python -m tools.generate_icd_yaml --check
      - name: Validate canonical six-ICD catalog projection
        run: python -m tools.validate_icd_yaml
      - name: Run losslessness, schema and safety regressions
        run: python -m unittest discover -s sdk/tests -p 'test_icd_yaml_contract.py' -v
