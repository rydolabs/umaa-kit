name: Original UMAA Battery Cyclone DDS integrated native wire tests
on:
  pull_request:
    paths:
      - '.github/workflows/official-battery-native-wire.yml'
      - 'sdk/include/umaa/official_battery_host.hpp'
      - 'sdk/include/umaa/official_battery_collection.hpp'
      - 'sdk/include/umaa/report_transport.hpp'
      - 'dds-backends/cyclone/include/umaa/cyclone_official_battery_codec.hpp'
      - 'tests/integration/cyclone/CMakeLists.txt'
      - 'tests/integration/cyclone/src/official_battery_*'
      - 'simulator/dds/official_battery_payload_oracle.c'
      - 'simulator/dds/run_battery_payload.py'
      - 'simulator/dds/run_battery_live_joiner.py'
      - 'simulator/dds/run_battery_multicell.py'
      - 'tools/official_battery_payload_structure.py'
      - 'catalog/official-evidence/eo-battery-payload-v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-battery-native-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UMAA_IDL_SHA256: 15e71e24df4663e8b4891c461f0e37823bce5087f0b5d5a52667f3c25cb56d08
      UMAA_IDL_URL: https://www.auvsi.org/wp-content/uploads/2025/03/umaa-6.0-idl-with-exp-services.zip
    steps:
      - uses: actions/checkout@v4
      - name: Install Cyclone DDS original TypeSupport compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cyclonedds-dev
      - name: Download and verify SHA-pinned original 594-IDL archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 \
            --connect-timeout 20 --max-time 120 "$UMAA_IDL_URL" \
            --output "$RUNNER_TEMP/umaa-official-idl.zip"
          printf '%s  %s\n' "$UMAA_IDL_SHA256" "$RUNNER_TEMP/umaa-official-idl.zip" | sha256sum --check
      - name: Verify original Battery nested Key and optional field declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.official_battery_payload_structure \
            --idl-zip "$RUNNER_TEMP/umaa-official-idl.zip" \
            --out "$RUNNER_TEMP/verified-battery-shapes.json"
      - name: Generate official Cyclone Battery TypeSupport in temporary directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.official_icd_evidence import inspected_zip
          dest = Path(os.environ["RUNNER_TEMP"]) / "official-battery-idl"
          dest.mkdir()
          with inspected_zip(Path(os.environ["RUNNER_TEMP"]) / "umaa-official-idl.zip") as z:
              assert z.testzip() is None
              z.extractall(dest)
          PY
          python3 tools/official_idl_compile.py \
            --root "$RUNNER_TEMP/official-battery-idl" \
            --source UMAA/EO/BatteryStatus/BatteryReportType.idl \
            --out "$RUNNER_TEMP/official-battery-typesupport"
      - name: Compile original Report Cell SDK Provider and Large List native CTests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/integration/cyclone -B "$RUNNER_TEMP/battery-build" \
            -DUMAA_OFFICIAL_GENERATED_ROOT="$RUNNER_TEMP/official-battery-typesupport" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/battery-build" --parallel 2 \
            --target umaa_official_battery_payload_publisher \
              umaa_official_battery_payload_oracle \
              umaa_official_battery_live_joiner_consumer \
              umaa_official_battery_multicell_publisher \
              umaa_official_battery_multicell_consumer \
              umaa_official_battery_sdk_bound_provider
      - name: Require eight actual on-wire positive and negative CTests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/battery-build" \
            -R '^official_umaa_battery_(payload_(wire|bad_checkpoint_rejected)|live_joiner_(good|bad)|multicell_(good|bad_checkpoint)|sdk_bound_provider_(wire|bad_checkpoint_rejected))$' \
            --output-on-failure -V
      - name: Scope and official Runtime gate
        if: success()
        run: |
          echo "OFFICIAL_BATTERY_CYCLONE_EIGHT_NATIVE_CASES_PASS"
          echo "No IDL/TypeSupport source committed or uploaded."
          echo "No official Runtime auto-generation, full QoS, or conformance claim."
