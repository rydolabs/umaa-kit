name: Official Battery SDK Handler / BoundReportProvider native Cyclone DDS wire
on:
  pull_request:
    paths:
      - '.github/workflows/official-battery-sdk-provider-wire.yml'
      - 'tests/integration/cyclone/src/official_battery_sdk_bound_provider.cpp'
      - 'tests/integration/cyclone/CMakeLists.txt'
      - 'sdk/include/umaa/report_transport.hpp'
      - 'sdk/include/umaa/official_battery_host.hpp'
      - 'dds-backends/cyclone/include/umaa/cyclone_official_battery_codec.hpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  battery-sdk-provider-native-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      UMAA_IDL_SHA256: 15e71e24df4663e8b4891c461f0e37823bce5087f0b5d5a52667f3c25cb56d08
      UMAA_IDL_URL: https://www.auvsi.org/wp-content/uploads/2025/03/umaa-6.0-idl-with-exp-services.zip
    steps:
      - uses: actions/checkout@v4
      - name: Install official CycloneDDS TypeSupport compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cyclonedds-dev
      - name: Authenticate original AUVSI source by exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --max-time 120 "$UMAA_IDL_URL" -o "$RUNNER_TEMP/original.zip"
          printf '%s  %s\n' "$UMAA_IDL_SHA256" "$RUNNER_TEMP/original.zip" | sha256sum --check
      - name: Source-audit exact nested Battery field and key declarations
        run: python3 -m tools.official_battery_payload_structure --idl-zip "$RUNNER_TEMP/original.zip"
      - name: Generate official Battery native TypeSupport only in ephemeral workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.official_icd_evidence import inspected_zip
          tmp=Path(os.environ["RUNNER_TEMP"])
          dest=tmp/"original-idl"
          dest.mkdir()
          with inspected_zip(tmp/"original.zip") as z:
              if z.testzip() is not None: raise RuntimeError("bad original ZIP")
              z.extractall(dest)
          PY
          python3 tools/official_idl_compile.py \
            --root "$RUNNER_TEMP/original-idl" \
            --source UMAA/EO/BatteryStatus/BatteryReportType.idl \
            --out "$RUNNER_TEMP/native-battery"
      - name: Compile SDK Handler/BoundReportProvider and standalone original-IDL C oracle
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/integration/cyclone -B "$RUNNER_TEMP/sdk-provider-build" \
            -DUMAA_OFFICIAL_GENERATED_ROOT="$RUNNER_TEMP/native-battery"
          cmake --build "$RUNNER_TEMP/sdk-provider-build" --parallel 2 \
            --target umaa_official_battery_sdk_bound_provider umaa_official_battery_payload_oracle
      - name: Actual SDK Provider DDS Report/Cell/Dispose including negative independent C oracle
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/sdk-provider-build" \
            -R '^official_umaa_battery_sdk_bound_provider_(wire|bad_checkpoint_rejected)$' \
            --output-on-failure -V
      - name: Explicit scope
        if: success()
        run: |
          echo "OFFICIAL_BATTERY_SDK_PROVIDER_NATIVE_CYCLONE_WIRE_PASS"
          echo "No generated official Runtime codegen enabled; no full QoS or compliance claim."
