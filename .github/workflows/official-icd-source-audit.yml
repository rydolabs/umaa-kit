name: Source-gated official IDL contract audit (synthetic CI only)
on:
  pull_request:
    paths:
      - 'tools/official_icd_evidence.py'
      - 'tools/official_icd_overlay.py'
      - 'tools/generate_official_native_type_registry.py'
      - 'sdk/tests/test_official_icd_evidence.py'
      - '.github/workflows/official-icd-source-audit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/official_icd_evidence.py'
      - 'tools/official_icd_overlay.py'
      - 'tools/generate_official_native_type_registry.py'
      - 'sdk/tests/test_official_icd_evidence.py'
      - '.github/workflows/official-icd-source-audit.yml'
jobs:
  source-audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'jsonschema==4.23.0'
      - name: Validate Topic, Key, embedded large-collection and ZIP safety
        run: python -m unittest discover -s sdk/tests -p test_official_icd_evidence.py -v
