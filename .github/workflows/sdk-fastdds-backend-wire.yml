name: SDK Fast DDS plugin real-wire (synthetic)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fastdds-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Fast DDS libraries and code generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfastrtps-dev libfastcdr-dev fastddsgen
          dpkg-query -W libfastrtps-dev fastddsgen
      - name: Configure Fast DDS plugin
        run: cmake -S dds/vendors/fastdds -B build/sdk-fastdds -DCMAKE_BUILD_TYPE=Release
      - name: Build plugin, device module, and consumer
        run: cmake --build build/sdk-fastdds --parallel 2
      - name: Execute independent-process DDS real wire test
        run: ctest --test-dir build/sdk-fastdds --output-on-failure -V
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-fastdds-synthetic-evidence
          path: build/sdk-fastdds/Testing/Temporary/
          if-no-files-found: warn
# Synthetic fixture only; no official UMAA normative evidence.
