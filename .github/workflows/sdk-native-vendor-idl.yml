name: Native IDL compilers -> SDK TypeSupport (Cyclone/Fast DDS)
on:
  push:
    branches: [sdk/native-vendor-idl-codegen-20261103]
  pull_request:
    paths:
      - tools/native_dds_codegen.py
      - sdk/tests/test_native_vendor_compilers.py
      - tests/fixtures/idl/native/**
      - tests/integration/native_compilers/**
      - .github/workflows/sdk-native-vendor-idl.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-synthetic-complex-idl:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Cyclone and Fast DDS toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cyclonedds-dev libfastrtps-dev libfastcdr-dev fastddsgen
          idlc -v || true
          fastddsgen -version || true
      - name: Validate fail-closed compiler driver contracts
        run: python3 -m unittest discover -s sdk/tests -p test_native_vendor_compilers.py -v
      - name: Generate complex synthetic types with BOTH real native compilers
        run: |
          python3 -m tools.native_dds_codegen \
            --root tests/fixtures/idl/native \
            --source NativeDevice.idl \
            --vendor both \
            --out "$RUNNER_TEMP/native-synthetic"
      - name: Build and load both actual vendor-generated TypeSupport shared libraries
        run: |
          cmake -S tests/integration/native_compilers -B "$RUNNER_TEMP/build-native-synthetic" \
            -DUMAA_NATIVE_GENERATED_ROOT="$RUNNER_TEMP/native-synthetic" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/build-native-synthetic" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/build-native-synthetic" --output-on-failure -V
  native-official-battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UMAA_IDL_SHA256: 15e71e24df4663e8b4891c461f0e37823bce5087f0b5d5a52667f3c25cb56d08
      UMAA_IDL_URL: https://www.auvsi.org/wp-content/uploads/2025/03/umaa-6.0-idl-with-exp-services.zip
    steps:
      - uses: actions/checkout@v4
      - name: Install official IDL vendor-native compilers and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cyclonedds-dev libfastrtps-dev libfastcdr-dev fastddsgen
      - name: Download source archive and VERIFY original AUVSI SHA-256
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 120 "$UMAA_IDL_URL" \
            -o "$RUNNER_TEMP/official-umaa-idl.zip"
          printf '%s  %s\n' "$UMAA_IDL_SHA256" "$RUNNER_TEMP/official-umaa-idl.zip" | sha256sum --check
      - name: Validate and extract only to ephemeral Runner directory
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.official_icd_evidence import inspected_zip
          temp=Path(os.environ["RUNNER_TEMP"])
          source=temp/"official-umaa-idl.zip"
          root=temp/"official-umaa-idl"
          root.mkdir()
          with inspected_zip(source) as z:
              assert z.testzip() is None
              assert len([n for n in z.namelist() if n.endswith(".idl")])==594
              assert "LICENSE" in z.namelist()
              z.extractall(root)
          print("UMAA_OFFICIAL_594_IDL_INPUT_VERIFIED")
          PY
      - name: Generate BOTH Cyclone and Fast DDS TypeSupport from original UMAA BatteryReportType
        run: |
          python3 -m tools.native_dds_codegen \
            --root "$RUNNER_TEMP/official-umaa-idl" \
            --source UMAA/EO/BatteryStatus/BatteryReportType.idl \
            --vendor both \
            --out "$RUNNER_TEMP/native-official"
      - name: Build and load both official native TypeSupport libraries
        run: |
          cmake -S tests/integration/native_compilers -B "$RUNNER_TEMP/build-native-official" \
            -DUMAA_NATIVE_GENERATED_ROOT="$RUNNER_TEMP/native-official" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/build-native-official" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/build-native-official" --output-on-failure -V
      - name: Confirm NO official source or generated TypeSupport uploaded to repository
        run: |
          echo "UMAA_OFFICIAL_NATIVE_TYPESUPPORT_BUILD_VERIFIED"
          echo "Original official files and generated vendor code remain under RUNNER_TEMP."
