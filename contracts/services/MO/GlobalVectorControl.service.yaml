apiVersion: kumaa.dev/v1alpha1
kind: ServiceICD

metadata:
  name: GlobalVectorControl
  namespace: UMAA::MO::GlobalVectorControl
  domain: MO
  description: Control vehicle speed, direction and depth or altitude
  labels:
    standard: umaa-6.0
    domain: maneuver-operations

spec:
  purpose: >-
    Direct vehicle speed, direction and depth or altitude. Tolerances, where
    supplied, influence command evaluation; details must be verified against
    the complete ICD and any applicable compliance requirements.

  operations:
    setGlobalVector:
      actor: consumer
      transport: command
      topicRef: command
      clause: "6.1.5.4"
      description: Issue a global vector command
    reportGlobalVectorCommandStatus:
      actor: provider
      transport: publish
      topicRef: status
      clause: "6.1.5.2"
      description: Publish command flow-control state
    queryGlobalVectorCommandAck:
      actor: consumer
      transport: subscribe
      topicRef: ack
      clause: "6.1.5"
      description: Subscribe to the command acknowledgement
    reportGlobalVectorCommandAck:
      actor: provider
      transport: publish
      topicRef: ack
      clause: "6.1.5.1"
      description: Publish the accepted command values
    queryGlobalVectorExecutionStatus:
      actor: consumer
      transport: subscribe
      topicRef: executionStatus
      clause: "6.1.5"
      description: Subscribe to command execution progress
    reportGlobalVectorExecutionStatus:
      actor: provider
      transport: publish
      topicRef: executionStatus
      clause: "6.1.5.3"
      description: Publish achieved speed, elevation and direction indicators
    cancelGlobalVectorCommand:
      actor: consumer
      transport: dds-dispose
      clause: "6.1.5"
      description: DDS-native cancellation; no independent cancel Topic
    reportGlobalVectorCancelCommandStatus:
      actor: provider
      transport: dds-native
      clause: "6.1.5"
      description: ICD direct-DDS cancellation result; no separate Topic declared

