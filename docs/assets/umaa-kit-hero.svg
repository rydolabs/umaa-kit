<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
<title id="title">UMAA Kit — compose services, generate components, ship native DLL and SO modules</title>
<desc id="desc">A five step pipeline from reviewed service contracts, through a Component Manifest and generator, to CMake projects and native modules. CLI is available as development preview; React Flow UI is planned; standalone Cyclone and Fast DDS backends are tested.</desc>
<defs>
