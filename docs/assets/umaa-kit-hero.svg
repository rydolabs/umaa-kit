  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36C5F0"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#3ee6ad"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123c41"/><stop offset="1" stop-color="#0b272f"/></linearGradient>
  <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="34"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#7ea5ce" stroke-width="1.8"/></marker>
</defs>
<rect width="1280" height="510" rx="26" fill="url(#bg)"/>
