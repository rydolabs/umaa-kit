<title id="title">Two workflows, one Component Assembly Manifest — CLI available, React Flow planned</title>
<desc id="desc">The current command-line tool and future visual React Flow designer share a manifest, validation, and CMake generator, resulting in editable DLL and SO module projects. Studio canvas is a roadmap item.</desc>
