# Optional developer PostgreSQL only. Configure secrets outside the repository.
services:
  studio-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${STUDIO_PG_USER:?required}
      POSTGRES_PASSWORD: ${STUDIO_PG_PASSWORD:?required}
      POSTGRES_DB: ${STUDIO_PG_DATABASE:-umaa_studio}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - studio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  studio_pgdata:
